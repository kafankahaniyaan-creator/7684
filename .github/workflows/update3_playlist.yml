name: Auto Update Third Playlist (Clean 1-Commit)

on:
  schedule:
    # Har 2 ghante me run hoga (10 minute offset ke sath taaki clash na ho)
    - cron: '10 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch Second Playlist from Worker
        run: |
          # Yahan apna doosra worker URL aur file name set karein
          curl -s "https://flat-cake-5037.bravetubez.workers.dev/?ab54dt" -o playlist3.m3u

      - name: Force Push Clean Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dono files aur workflows folder ko add karega
          git add -A
          
          git checkout --orphan temp-branch-2
          git commit -m "Auto-update second playlist [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          
          git branch -D main || true
          git branch -m main
          git push -f origin main
